<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Foto: Grooming &amp; Perawatan">
  <rect width="600" height="600" fill="#f5f3ff"/>
  <circle cx="300" cy="240" r="140" fill="#7c3aed" opacity="0.12"/>
  <g transform="translate(300, 235) scale(1.1)">
    <!-- Grooming Comb & Scissors / Sparkles -->
    <!-- Comb -->
    <rect x="-45" y="-30" width="90" height="24" rx="4" fill="#7c3aed"/>
    <path d="M-40,-6 L-40,25 M-30,-6 L-30,25 M-20,-6 L-20,25 M-10,-6 L-10,25 M0,-6 L0,25 M10,-6 L10,25 M20,-6 L20,25 M30,-6 L30,25 M40,-6 L40,25" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
    <!-- Bubbles -->
    <circle cx="-50" cy="-45" r="14" fill="#a78bfa" opacity="0.6"/>
    <circle cx="45" cy="-55" r="18" fill="#a78bfa" opacity="0.7"/>
    <circle cx="20" cy="-60" r="10" fill="#c4b5fd" opacity="0.8"/>
    <!-- Sparkle star -->
    <path d="M-20,-65 Q-20,-50 -5,-50 Q-20,-50 -20,-35 Q-20,-50 -35,-50 Q-20,-50 -20,-65 Z" fill="#fbbf24"/>
  </g>
  <text x="300" y="475" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="44" font-weight="800" fill="#1b2420">Grooming Sehat</text>
  <text x="300" y="525" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#6d28d9">Salon Bersih, Kuku &amp; Telinga • Petskarta</text>
</svg>
