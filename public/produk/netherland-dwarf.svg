<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Foto: Netherland Dwarf">
  <rect width="600" height="600" fill="#f0f7f6"/>
  <circle cx="300" cy="240" r="140" fill="#1f6b4f" opacity="0.12"/>
  <g transform="translate(300, 245) scale(1.15)">
    <!-- Upright short ears -->
    <path d="M-28,-20 C-35,-80 -12,-85 -8,-20 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M-24,-20 C-30,-68 -16,-72 -12,-20 Z" fill="#fed7aa"/>
    <path d="M28,-20 C35,-80 12,-85 8,-20 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M24,-20 C30,-68 16,-72 12,-20 Z" fill="#fed7aa"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Eyes (Ruby / dark) -->
    <circle cx="-18" cy="10" r="6.5" fill="#991b1b"/>
    <circle cx="18" cy="10" r="6.5" fill="#991b1b"/>
    <circle cx="-16.5" cy="8.5" r="2" fill="#ffffff"/>
    <circle cx="19.5" cy="8.5" r="2" fill="#ffffff"/>
    <!-- Nose & Mouth -->
    <ellipse cx="0" cy="26" rx="4" ry="3" fill="#f472b6"/>
    <path d="M0,29 C-3,35 -8,35 -10,32 M0,29 C3,35 8,35 10,32" stroke="#64748b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <text x="300" y="475" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="44" font-weight="800" fill="#1b2420">Netherland Dwarf</text>
  <text x="300" y="525" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f6b4f">Kelinci Kerdil Pedigree • Petskarta</text>
</svg>
